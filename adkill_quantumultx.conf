; adkill — Quantumult X 用 設定断片 (未保守の参考設定。実機未検証。本運用は adkill.conf)
; 既存の設定ファイルの各セクションに追記する（セクションごと丸ごと置き換えない）
; script-response-body は rhenium075/adkill を指す
; ============================================================

[general]
; QUIC(HTTP/3) を潰し、Chrome→Google の通信を TCP に落として復号可能にする
udp_drop_list=443
; 復号・ルール適用から外すプロセス/ホストは [mitm] の hostname で "-" 指定する

[dns]
; AdGuard DNS（フィルタ付き）を DoH で使用。個人用 AdGuard DNS を作った場合はそちらの DoH アドレスに置換
no-system
doh-server=https://dns.adguard-dns.com/dns-query

[filter_remote]
; 広告ドメインのルールセット（404 になったら各リポジトリで最新パスを確認）
https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/QuantumultX/Advertising/Advertising.list, tag=Advertising, force-policy=reject, update-interval=86400, opt-parser=false, enabled=true
https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanAD.list, tag=BanAD, force-policy=reject, update-interval=86400, opt-parser=true, enabled=true
https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanProgramAD.list, tag=BanProgramAD, force-policy=reject, update-interval=86400, opt-parser=true, enabled=true

[rewrite_local]
; --- 広告スクリプト/ビーコンは 200 空応答（読み込み失敗検知を回避） ---
^https?:\/\/[^\/]*(googlesyndication\.com|doubleclick\.net|googleadservices\.com|googletagservices\.com|googletagmanager\.com|google-analytics\.com|fundingchoicesmessages\.google\.com|adservice\.google\.(com|co\.jp)|admob\.com)\/ url reject-200
^https?:\/\/[^\/]*(adnxs\.com|adsrvr\.org|criteo\.(com|net)|rubiconproject\.com|pubmatic\.com|openx\.net|casalemedia\.com|smartadserver\.com|taboola\.com|outbrain\.com|amazon-adsystem\.com|moatads\.com|scorecardresearch\.com|doubleverify\.com|adsafeprotected\.com|applovin\.com|unityads\.unity3d\.com|adcolony\.com|teads\.tv|mgid\.com)\/ url reject-200
^https?:\/\/[^\/]*(popin\.cc|gmossp-sp\.jp|i-mobile\.co\.jp|adingo\.jp|fluct\.jp|socdm\.com|adtdp\.com|nend\.net|amoad\.com|microad\.(jp|net)|impact-ad\.jp|logly\.co\.jp|ladsp\.com|zucks\.net|gssp\.asia|adsta\.jp|ad-stir\.com|uncn\.jp|yads\.yahoo\.co\.jp|yads\.c\.yimg\.jp)\/ url reject-200
; --- アンチアドブロック検知スクリプトのファイル名パターン ---
^https?:\/\/[^\/]+\/.*(adsbygoogle|\/gpt|prebid|apstag|blockadblock|fuckadblock|adblock[-_]?detect|detect[-_]?adblock|anti[-_]?adblock|adblockdetect|ads\.js)[^\/]*\.js url reject-200
; --- 文書らしい URL のみに注入（必ず最後に置く。バイナリ応答を通すと画像が壊れる） ---
^https?:\/\/[^\/?#]+(?:\/(?:[^?#]*\/)?(?:[^.\/?#]*|[^\/?#]+\.(?:html?|php|aspx?|jsp)))?(?:[?#].*)?$ url script-response-body https://raw.githubusercontent.com/rhenium075/adkill/main/adkill.js

[mitm]
; QX で "*" 単独が拒否される場合は、対象ドメインをワイルドカードで列挙する（例: *.google.com, *.google.co.jp, *.yahoo.co.jp, *.hatena.ne.jp, ...）
; 旧広域 MITM は廃止。Shadowrocket 用 conf の許可リストを参照して同等に絞ること (未検証)
hostname = example.com, *.example.com, example.org, *.example.org, neverssl.com, *.neverssl.com, httpforever.com, *.httpforever.com, html-load.com, fb.html-load.com, content-loader.com, fb.content-loader.com, css-load.com, *.css-load.com, img-load.com, *.img-load.com, error-report.com, *.error-report.com, element-tags.com, *.element-tags.com, page-speed.org, *.page-speed.org, cdn-delivery.net, *.cdn-delivery.net, *.googlesyndication.com, doubleclick.net, *.doubleclick.net, *.googleadservices.com, *.googletagservices.com, adservice.google.com, adservice.google.co.jp, *.googletagmanager.com, *.google-analytics.com, fundingchoicesmessages.google.com, *.admob.com, npttech.com, *.npttech.com, *.adnxs.com, *.adsrvr.org, *.criteo.com, *.criteo.net, *.rubiconproject.com, *.pubmatic.com, *.openx.net, *.casalemedia.com, *.smartadserver.com, *.taboola.com, *.outbrain.com, *.amazon-adsystem.com, *.moatads.com, *.scorecardresearch.com, *.doubleverify.com, *.adsafeprotected.com, *.applovin.com, unityads.unity3d.com, *.adcolony.com, *.teads.tv, *.mgid.com, *.addefend.com, btloader.com, *.btloader.com, *.blockthrough.com, *.popin.cc, *.gmossp-sp.jp, *.i-mobile.co.jp, *.adingo.jp, *.fluct.jp, *.socdm.com, *.adtdp.com, *.nend.net, *.amoad.com, *.microad.jp, *.microad.net, *.impact-ad.jp, *.logly.co.jp, *.ladsp.com, *.zucks.net, *.adsta.jp, *.ad-stir.com, *.uncn.jp, yads.yahoo.co.jp, yads.c.yimg.jp, b99.yahoo.co.jp, clb.yahoo.co.jp, quriosity.yahoo.co.jp, *.geniee.co.jp, *.gsspat.jp, *.gssprt.jp, aladdin.genieesspv.jp, *.fout.jp, *.fam-8.net, *.anymind360.com
; 証明書は QX 内で生成 → passphrase / p12 が自動で書き込まれる
