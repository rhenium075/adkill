# ---- 外部ルールセット（404 になったら各リポジトリで最新パスを確認）----
RULE-SET,https://raw.githubusercontent.com/rhenium075/adkill/main/adkill_custom.list,REJECT-TINYGIF
RULE-SET,https://raw.githubusercontent.com/rhenium075/adkill/main/adkill_jp.list,REJECT-TINYGIF
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Advertising/Advertising.list,REJECT-TINYGIF
RULE-SET,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanAD.list,REJECT-TINYGIF
RULE-SET,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanProgramAD.list,REJECT-TINYGIF

# ---- ローカル/LAN は直結 ----
DOMAIN-SUFFIX,local,DIRECT
IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
IP-CIDR,127.0.0.0/8,DIRECT,no-resolve

FINAL,DIRECT
[Host]
localhost = 127.0.0.1

[URL Rewrite]
# （必要になったらここに追加。基本は [Rule] の REJECT-TINYGIF と [Script] で処理）

[Script]
# pattern は「文書らしい URL」のみに限定する (2026-09-10)。
# 旧 pattern=^https?://.+ は画像/フォント等の全バイナリ応答まで requires-body で
# バッファリングさせ、Shadowrocket のバイナリ body 処理の弱点により
# 画像が壊れて表示崩れになる (jetstream.blog で実機確認)。
# マッチ対象: ホストのみ / 末尾スラッシュ / 拡張子なし最終セグメント / .html .php 等。
# 画像・CSS・JS・フォント・動画などはスクリプトを通らず素通しになる。
adkill = type=http-response, pattern=^https?:\/\/[^\/?#]+(?:\/(?:[^?#]*\/)?(?:[^.\/?#]*|[^\/?#]+\.(?:html?|php|aspx?|jsp)))?(?:[?#].*)?$, requires-body=1, max-size=3145728, timeout=30, script-path=https://raw.githubusercontent.com/rhenium075/adkill/main/adkill.js?v=3, script-update-interval=3600

[MITM]
enable = true
# ==== 復号は「許可リスト」方式 (2026-09-10 に全面転換) ====
# 旧方式 (*.com 等の包括ワイルドカード + 除外) は、requires-body スクリプトと組み合わさると
#  - HTTP/1.1 + Connection: close のサイト (newsdig/livedoor/FNN) で応答が返らない
#  - 拡張子なし URL の画像 (googleusercontent/ggpht) や API/SSE (Claude/ChatGPT/Chrome sync)
#    を巻き込んで壊す
# ことが実機ログで確定したため、復号するのは
#  「TINYGIF の 200 偽装が必要な広告/アンチアドブロックドメイン」+「バッジ検証用」のみとする。
# 一般サイト・アプリ・API は一切復号しない (= 壊れない)。
# 追加が必要になったら conf ではなく adkill_mitm.sgmodule の %APPEND% に正の項目を足すこと
# (conf を触ると ca-p12 が消えるため)。
hostname = example.com, *.example.com, example.org, *.example.org, neverssl.com, *.neverssl.com, httpforever.com, *.httpforever.com, html-load.com, fb.html-load.com, content-loader.com, fb.content-loader.com, css-load.com, *.css-load.com, img-load.com, *.img-load.com, error-report.com, *.error-report.com, element-tags.com, *.element-tags.com, page-speed.org, *.page-speed.org, cdn-delivery.net, *.cdn-delivery.net, *.googlesyndication.com, doubleclick.net, *.doubleclick.net, *.googleadservices.com, *.googletagservices.com, adservice.google.com, adservice.google.co.jp, *.googletagmanager.com, *.google-analytics.com, fundingchoicesmessages.google.com, *.admob.com, npttech.com, *.npttech.com, *.adnxs.com, *.adsrvr.org, *.criteo.com, *.criteo.net, *.rubiconproject.com, *.pubmatic.com, *.openx.net, *.casalemedia.com, *.smartadserver.com, *.taboola.com, *.outbrain.com, *.amazon-adsystem.com, *.moatads.com, *.scorecardresearch.com, *.doubleverify.com, *.adsafeprotected.com, *.applovin.com, unityads.unity3d.com, *.adcolony.com, *.teads.tv, *.mgid.com, *.addefend.com, btloader.com, *.btloader.com, *.blockthrough.com, *.popin.cc, *.gmossp-sp.jp, *.i-mobile.co.jp, *.adingo.jp, *.fluct.jp, *.socdm.com, *.adtdp.com, *.nend.net, *.amoad.com, *.microad.jp, *.microad.net, *.impact-ad.jp, *.logly.co.jp, *.ladsp.com, *.zucks.net, *.adsta.jp, *.ad-stir.com, *.uncn.jp, yads.yahoo.co.jp, yads.c.yimg.jp, b99.yahoo.co.jp, clb.yahoo.co.jp, quriosity.yahoo.co.jp, *.geniee.co.jp, *.gsspat.jp, *.gssprt.jp, aladdin.genieesspv.jp, *.fout.jp, *.fam-8.net, *.anymind360.com
# ca-passphrase / ca-p12 はアプリ内で「証明書を生成」すると自動で追記される
