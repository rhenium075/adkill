RULE-SET,https://raw.githubusercontent.com/rhenium075/adkill/main/adkill_custom.list,REJECT-TINYGIF
RULE-SET,https://raw.githubusercontent.com/rhenium075/adkill/main/adkill_jp.list,REJECT-TINYGIF
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Advertising/Advertising.list,REJECT-TINYGIF
RULE-SET,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanAD.list,REJECT-TINYGIF
RULE-SET,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanProgramAD.list,REJECT-TINYGIF

# ---- ローカル/LAN は直結 ----
DOMAIN-SUFFIX,local,DIRECT
IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
IP-CIDR,127.0.0.0/8,DIRECT,no-resolve

FINAL,DIRECT
[Host]
localhost = 127.0.0.1

[URL Rewrite]
# （必要になったらここに追加。基本は [Rule] の REJECT-TINYGIF と [Script] で処理）

[Script]
# pattern は「文書らしい URL」のみに限定する (2026-09-10)。
# 旧 pattern=^https?://.+ は画像/フォント等の全バイナリ応答まで requires-body で
# バッファリングさせ、Shadowrocket のバイナリ body 処理の弱点により
# 画像が壊れて表示崩れになる (jetstream.blog で実機確認)。
# マッチ対象: ホストのみ / 末尾スラッシュ / 拡張子なし最終セグメント / .html .php 等。
# 画像・CSS・JS・フォント・動画などはスクリプトを通らず素通しになる。
adkill = type=http-response, pattern=^https?:\/\/[^\/?#]+(?:\/(?:[^?#]*\/)?(?:[^.\/?#]*|[^\/?#]+\.(?:html?|php|aspx?|jsp)))?(?:[?#].*)?$, requires-body=1, max-size=3145728, timeout=30, script-path=https://raw.githubusercontent.com/rhenium075/adkill/main/adkill.js?v=3, script-update-interval=3600

[MITM]
enable = true
# 全ホストを復号し、証明書ピンニングで壊れる/触る必要のないものを "-" で除外
hostname = *.com, *.net, *.org, *.jp, *.io, *.co, *.me, *.tv, *.cc, *.fm, *.info, *.biz, *.xyz, *.site, *.online, *.dev, *.app, *.blog, *.news, *.gg, *.moe, *.wiki, *.ai, *.to, *.la, *.st, *.asia, *.tech, *.cloud, *.live, *.life, *.media, *.social, *.video, *.games, *.store, *.shop, *.work, *.tokyo, *.link, *.click, *.golf, *.promo, -*.apple.com, -*.icloud.com, -*.icloud-content.com, -*.mzstatic.com, -*.push.apple.com, -*.apple-cloudkit.com, -*.googleapis.com, -*.googlevideo.com, -*.gvt1.com, -*.gvt2.com, -*.gstatic.com, -*.line.me, -*.line-apps.com, -*.line.naver.jp, -*.line-scdn.net, -*.paypay.ne.jp, -*.paypay-corp.co.jp, -*.mufg.jp, -*.smbc.co.jp, -*.mizuhobank.co.jp, -*.rakuten-bank.co.jp, -*.jp-bank.japanpost.jp, -*.sbisec.co.jp, -*.docomo.ne.jp, -*.nttdocomo.co.jp, -*.au.com, -*.kddi.com, -*.softbank.jp, -*.nintendo.net, -*.nintendo.com, -*.playstation.com, -*.sony.com, -*.sonyentertainmentnetwork.com, -*.microsoft.com, -*.live.com, -*.windows.com, -*.office.com, -*.office365.com, -*.slack.com, -*.slack-edge.com, -*.whatsapp.net, -*.signal.org, -*.stripe.com, -*.myjcb.co.jp, -*.smbc-card.com, -*.rakuten-card.co.jp, -*.mercari.com, -*.mercari.jp
