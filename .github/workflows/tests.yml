name: tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/tests/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: npm ci
        working-directory: tools/tests
      - run: npm test
        working-directory: tools/tests
      - run: npm run test:release
        working-directory: tools/tests
      - run: npm install --no-save --package-lock=false playwright@1.62.1
        working-directory: tools/tests
      - run: npx playwright install --with-deps chromium
        working-directory: tools/tests
      - run: node e2e_browser_test.js --required
        working-directory: tools/tests
